packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

# Native/postinstall builds we explicitly trust. Everything else is blocked by
# default, which keeps a compromised transitive dependency from running code
# during install.
allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  '@swc/core': true
  msw: true
